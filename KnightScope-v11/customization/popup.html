<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Best Move · KnightScope</title>
<link rel="stylesheet" href="../liquid.css"><link rel="stylesheet" href="popup.css"></head>
<body>
<div class="ambient"></div>
<div class="pop">
  <div class="hdr">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18 17 7m0 0H9.5M17 7v7.5"/></svg></div>
    <div><h1>Best Move</h1><div class="sub" id="where">Checking…</div></div>
  </div>
  <button class="big primary" id="studio" type="button"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7.5l8 4.5 8-4.5zM4 12l8 4.5 8-4.5M4 16.5 12 21l8-4.5"/></svg></span><span><b>Open Studio</b><small>Pieces, board, effects</small></span></button>
  <div class="two">
    <button class="big" id="analysis" type="button"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></span><span><b>Analysis</b></span></button>
    <button class="big" id="show" type="button"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg></span><span><b>Reset panel</b></span></button>
  </div>
  <label class="quick" for="assist"><span><b>Assist</b><small id="assistState">Arrows and suggestions</small></span><span class="tgl"><input type="checkbox" id="assist" aria-label="Turn assist on or off"><i></i></span></label>
  <div class="two">
    <button class="big" id="rate" type="button"><span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.3 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg></span><span><b>Rate</b></span></button>
    <button class="big" id="suggest" type="button"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span><span><b>Suggest</b></span></button>
  </div>
  <div id="msg" class="muted small" role="status" aria-live="polite"></div>
  <div id="sp"></div>
  <div class="foot"><span id="ver"></span><span class="links"><button type="button" id="exp">Export settings</button><button type="button" id="imp">Import</button></span><input type="file" id="impFile" accept="application/json,.json" hidden></div>
</div>
<div class="pop" id="fbView" hidden>
  <div class="hdr">
    <button class="back" id="fbBack" type="button" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
    <div><h1>Send a suggestion</h1><div class="sub">Ideas, problems, anything.</div></div>
  </div>
  <div id="fbMount"></div>
</div>
<script src="../features/spotify-widget.js"></script><script src="../features/feedback.js"></script><script src="popup.js"></script>
<script src="../window-controls.js"></script><script src="../version-label.js"></script>
</body></html>
