name: Package KnightScope V10
on:
  push:
    branches: [main]
    paths: ["KnightScope-v10/**", ".github/workflows/package-knightscope-v10.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate and package
        run: |
          node -e "const m=require('./KnightScope-v10/manifest.json'); if(m.version!=='10.0.0') process.exit(1)"
          cd KnightScope-v10 && zip -qr ../KnightScope-v10.zip . && cd ..
          unzip -t KnightScope-v10.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KnightScope-v10
          path: KnightScope-v10.zip
          if-no-files-found: error
          retention-days: 30
      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KnightScope-v10.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build KnightScope V10 package"
          git pull --rebase origin main
          git push origin HEAD:main
