name: Package KnightScope v4
on:
  push:
    branches: [main]
    paths:
      - "KnightScope-v4/**"
      - ".github/workflows/package-knightscope-v4.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package extension
        run: |
          zip -qr KnightScope-v4.zip KnightScope-v4
          unzip -t KnightScope-v4.zip
      - name: Commit package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KnightScope-v4.zip
          git diff --cached --quiet || git commit -m "Build KnightScope v4 package"
          git push
