name: Package KnightScope V8
on:
  push:
    branches: [main]
    paths:
      - "KnightScope-v8/**"
      - ".github/workflows/package-knightscope-v8.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build extension ZIP
        run: |
          cd KnightScope-v8
          zip -qr ../KnightScope-v8.zip .
          cd ..
          unzip -t KnightScope-v8.zip
      - name: Upload V8 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnightScope-v8
          path: KnightScope-v8.zip
          if-no-files-found: error
          retention-days: 30
