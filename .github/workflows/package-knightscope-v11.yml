name: Package KnightScope V11
on:
  push:
    branches: [main]
    paths:
      - "KnightScope-v11/**"
      - ".github/workflows/package-knightscope-v11.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate manifest, files, and JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'KnightScope-v11';
          const manifest = JSON.parse(fs.readFileSync(path.join(root, 'manifest.json'), 'utf8'));
          if (manifest.version !== '11.0.0') throw new Error('Unexpected manifest version');
          for (const group of manifest.content_scripts || []) {
            for (const file of group.js || []) {
              if (!fs.existsSync(path.join(root, file))) throw new Error('Missing content script: ' + file);
            }
          }
          for (const group of manifest.web_accessible_resources || []) {
            for (const file of group.resources || []) {
              if (!fs.existsSync(path.join(root, file))) throw new Error('Missing web resource: ' + file);
            }
          }
          for (const id of ['engineSelect']) {
            if (!fs.readFileSync(path.join(root, 'analysis.html'), 'utf8').includes('id="' + id + '"')) {
              throw new Error('Missing Analysis Board control: ' + id);
            }
          }
          console.log('Manifest and referenced files validated:', manifest.version);
          NODE
          find KnightScope-v11 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build and validate ZIP
        run: |
          cd KnightScope-v11
          zip -qr ../KnightScope-v11.zip .
          cd ..
          unzip -t KnightScope-v11.zip
      - name: Upload V11 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnightScope-v11
          path: KnightScope-v11.zip
          if-no-files-found: error
          retention-days: 30
      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KnightScope-v11.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build KnightScope V11 package"
          git pull --rebase origin main
          git push origin HEAD:main
