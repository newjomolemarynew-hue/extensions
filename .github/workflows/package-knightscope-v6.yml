name: Package KnightScope V6
on:
  push:
    branches: [main]
    paths:
      - "KnightScope-v6/**"
      - ".github/workflows/package-knightscope-v6.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build extension ZIP
        run: |
          zip -qr KnightScope-v6.zip KnightScope-v6
          unzip -t KnightScope-v6.zip
      - name: Commit ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KnightScope-v6.zip
          if ! git diff --cached --quiet; then
            git commit -m "Build KnightScope V6 package"
            git push
          fi
