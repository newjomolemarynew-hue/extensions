name: KnightScope merged build

on:
  push:
    branches:
      - knightscope-combined
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build merged extension
        run: node KnightScope/build.mjs
      - name: Upload installable extension folder
        uses: actions/upload-artifact@v4
        with:
          name: KnightScope-test-build
          path: KnightScope/dist/
          if-no-files-found: error
          retention-days: 14
