name: KnightScope merged build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build merged extension
        run: node KnightScope/build.mjs
      - name: Package KnightScope with manifest at ZIP root
        run: |
          cd KnightScope/dist
          zip -qr ../KnightScope.zip .
      - name: Upload installable KnightScope folder
        uses: actions/upload-artifact@v4
        with:
          name: KnightScope
          path: KnightScope/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Commit release ZIP to current branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KnightScope/KnightScope.zip
          if git diff --cached --quiet; then
            echo "Release ZIP is already up to date."
          else
            git commit -m "Package KnightScope with manifest at ZIP root"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
