name: KnightScope merged build

on:
  push:
    branches:
      - knightscope-combined
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build merged extension
        run: node KnightScope/build.mjs
      - name: Upload installable extension folder
        uses: actions/upload-artifact@v4
        with:
          name: KnightScope-test-build
          path: KnightScope/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Package release ZIP
        run: |
          cd KnightScope
          zip -qr KnightScope-v0.1.0.zip dist
      - name: Commit release ZIP to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KnightScope/KnightScope-v0.1.0.zip
          if git diff --cached --quiet; then
            echo "Release ZIP is already up to date."
          else
            git commit -m "Add KnightScope v0.1.0 release ZIP"
            git push origin HEAD:knightscope-combined
          fi
