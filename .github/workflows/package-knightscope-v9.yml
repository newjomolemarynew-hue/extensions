name: Package KnightScope V9
on:
  push:
    branches: [main]
    paths:
      - "KnightScope-v9/**"
      - ".github/workflows/package-knightscope-v9.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate manifest and build ZIP
        run: |
          node -e "const m=require('./KnightScope-v9/manifest.json'); if(m.version!=='9.0.0') process.exit(1); console.log('Manifest version:',m.version)"
          cd KnightScope-v9
          zip -qr ../KnightScope-v9.zip .
          cd ..
          unzip -t KnightScope-v9.zip
      - name: Upload V9 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: KnightScope-v9
          path: KnightScope-v9.zip
          if-no-files-found: error
          retention-days: 30
      - name: Commit ZIP to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KnightScope-v9.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build KnightScope V9 package"
          git pull --rebase origin main
          git push origin HEAD:main
