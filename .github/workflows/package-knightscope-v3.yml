name: Package KnightScope v3
on:
  push:
    branches: [main]
    paths:
      - 'KnightScope-v3/**'
      - '.github/workflows/package-knightscope-v3.yml'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build ZIP
        run: |
          rm -f KnightScope-v3.zip
          zip -qr KnightScope-v3.zip KnightScope-v3
          unzip -t KnightScope-v3.zip
      - name: Commit ZIP and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/package-knightscope-v3.yml
          git add KnightScope-v3.zip
          git add -u .github/workflows/package-knightscope-v3.yml || true
          git commit -m "Add KnightScope v3 ZIP package" || exit 0
          git push
