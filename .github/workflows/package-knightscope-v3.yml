name: Package KnightScope v3
on:
  push:
    branches: [main]
    paths:
      - "KnightScope-v3/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build extension ZIP
        run: |
          rm -f KnightScope-v3.zip
          zip -qr KnightScope-v3.zip KnightScope-v3
          unzip -t KnightScope-v3.zip
      - name: Commit updated ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KnightScope-v3.zip
          if git diff --cached --quiet; then
            echo "ZIP is already up to date"
            exit 0
          fi
          git commit -m "Package KnightScope v3 ZIP"
          git push
